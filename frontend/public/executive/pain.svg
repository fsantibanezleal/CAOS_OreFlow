<svg xmlns="http://www.w3.org/2000/svg" id="oreflow-pain-en" viewBox="0 0 960 520" role="img" aria-labelledby="oreflow-pain-en-title oreflow-pain-en-desc" lang="en">
<title id="oreflow-pain-en-title">One change reaches the whole circuit</title>
<desc id="oreflow-pain-en-desc">Feed, grinding, separation and product quality are coupled by flows and recycle.</desc>
<defs><style>#oreflow-pain-en text{font:26px var(--font-sans,system-ui);fill:var(--color-fg)}#oreflow-pain-en .title{font-size:30px;font-weight:650}#oreflow-pain-en .heading{font-size:27px;font-weight:650}#oreflow-pain-en .panel{fill:var(--color-surface);stroke:var(--color-border);stroke-width:2}#oreflow-pain-en .soft{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:2}#oreflow-pain-en .line{fill:none;stroke:var(--color-fg-subtle);stroke-width:3}#oreflow-pain-en .flow{fill:none;stroke:var(--color-accent);stroke-width:3;stroke-dasharray:9 7;animation:oreflow-pain-en-flow 2s linear 5}#oreflow-pain-en .recycle{stroke-dasharray:5 5}#oreflow-pain-en .accent{fill:var(--color-accent);stroke:none}@keyframes oreflow-pain-en-flow{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){#oreflow-pain-en .flow{animation:none}}</style><marker id="oreflow-pain-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="accent" d="M0 0 10 5 0 10Z"/></marker></defs>
<text x="24" y="40" class="title" text-anchor="start">One change reaches the whole circuit</text>
<rect class="panel" x="24" y="78" width="210" height="218" rx="12"/><text x="40" y="113" class="heading" text-anchor="start">Feed</text><text x="40" y="156" class="body" text-anchor="start">Size / grade</text><text x="40" y="191" class="body" text-anchor="start">Hardness</text>
<rect class="panel" x="258" y="78" width="210" height="218" rx="12"/><text x="274" y="113" class="heading" text-anchor="start">Grinding</text><text x="274" y="156" class="body" text-anchor="start">Mill / classifier</text><text x="274" y="191" class="body" text-anchor="start">Power</text><text x="274" y="226" class="body" text-anchor="start">Achieved P80</text>
<rect class="panel" x="492" y="78" width="210" height="218" rx="12"/><text x="508" y="113" class="heading" text-anchor="start">Separation</text><text x="508" y="156" class="body" text-anchor="start">Recovery</text><text x="508" y="191" class="body" text-anchor="start">Concentrate</text><text x="508" y="226" class="body" text-anchor="start">grade</text>
<rect class="panel" x="726" y="78" width="210" height="218" rx="12"/><text x="742" y="113" class="heading" text-anchor="start">Products</text><text x="742" y="156" class="body" text-anchor="start">Recovered</text><text x="742" y="191" class="body" text-anchor="start">metal</text><text x="742" y="226" class="body" text-anchor="start">Tailings metal</text>
<path class="flow" d="M234 180H258" marker-end="url(#oreflow-pain-en-arrow)"/>
<path class="flow" d="M468 180H492" marker-end="url(#oreflow-pain-en-arrow)"/>
<path class="flow" d="M702 180H726" marker-end="url(#oreflow-pain-en-arrow)"/>
<path class="flow recycle" d="M450 296V335H276V299" marker-end="url(#oreflow-pain-en-arrow)"/>
<text x="480" y="380" class="body" text-anchor="middle">Recycle changes the mill load</text>
<rect class="soft" x="24" y="412" width="912" height="94" rx="12"/>
<text x="44" y="450" class="body" text-anchor="start">A requested grind must fit installed power.</text>
<text x="44" y="486" class="body" text-anchor="start">Recovery, grade, water and throughput stay connected.</text>
</svg>
