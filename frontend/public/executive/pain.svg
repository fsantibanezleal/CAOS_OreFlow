<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Fragmented process evidence</title><desc id="desc">Evidencia de proceso fragmentada</desc><defs><style>.node{fill:var(--color-surface);stroke:var(--color-border);stroke-width:3}text{font:600 15px system-ui;fill:var(--color-fg)}.flow{fill:none;stroke:var(--color-accent);stroke-width:4;stroke-dasharray:9 8;animation:move 2s linear infinite}@keyframes move{to{stroke-dashoffset:-34}}@media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 1; } }</style></defs><rect width="900" height="300" rx="22" fill="var(--color-surface)"/><text x="36" y="45" font-family="system-ui" font-size="14" fill="var(--color-fg-subtle)">OreFlow research path</text><path class="flow" d="M 230 148 H 350"/><path class="flow" d="M 450 148 H 570"/><path class="flow" d="M 670 148 H 790"/><circle class="node" cx="180" cy="148" r="49"/><text x="180" y="154" text-anchor="middle">Feed</text><circle class="node" cx="400" cy="148" r="49"/><text x="400" y="154" text-anchor="middle">Crushing</text><circle class="node" cx="620" cy="148" r="49"/><text x="620" y="154" text-anchor="middle">Grinding</text><circle class="node" cx="800" cy="148" r="49"/><text x="800" y="154" text-anchor="middle">Separation</text></svg>