<svg xmlns="http://www.w3.org/2000/svg" id="oreflow-proposal-en" viewBox="0 0 960 520" role="img" aria-labelledby="oreflow-proposal-en-title oreflow-proposal-en-desc" lang="en">
<title id="oreflow-proposal-en-title">A controlled comparison preserves context</title>
<desc id="oreflow-proposal-en-desc">Declare a bounded change, solve the circuit, compare evidence and state the limitations.</desc>
<defs><style>#oreflow-proposal-en text{font:26px var(--font-sans,system-ui);fill:var(--color-fg)}#oreflow-proposal-en .title{font-size:30px;font-weight:650}#oreflow-proposal-en .heading{font-size:27px;font-weight:650}#oreflow-proposal-en .panel{fill:var(--color-surface);stroke:var(--color-border);stroke-width:2}#oreflow-proposal-en .soft{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:2}#oreflow-proposal-en .line{fill:none;stroke:var(--color-fg-subtle);stroke-width:3}#oreflow-proposal-en .flow{fill:none;stroke:var(--color-accent);stroke-width:3;stroke-dasharray:9 7;animation:oreflow-proposal-en-flow 2s linear 5}#oreflow-proposal-en .recycle{stroke-dasharray:5 5}#oreflow-proposal-en .accent{fill:var(--color-accent);stroke:none}@keyframes oreflow-proposal-en-flow{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){#oreflow-proposal-en .flow{animation:none}}</style><marker id="oreflow-proposal-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="accent" d="M0 0 10 5 0 10Z"/></marker></defs>
<text x="24" y="40" class="title" text-anchor="start">A controlled comparison preserves context</text>
<rect class="panel" x="24" y="78" width="260" height="170" rx="12"/><text x="40" y="113" class="heading" text-anchor="start">Define a change</text><text x="40" y="156" class="body" text-anchor="start">Case / input</text><text x="40" y="191" class="body" text-anchor="start">Operating bounds</text>
<rect class="panel" x="350" y="78" width="260" height="170" rx="12"/><text x="366" y="113" class="heading" text-anchor="start">Solve the circuit</text><text x="366" y="156" class="body" text-anchor="start">Mass / water</text><text x="366" y="191" class="body" text-anchor="start">Equipment limits</text>
<rect class="panel" x="676" y="78" width="260" height="170" rx="12"/><text x="692" y="113" class="heading" text-anchor="start">Compare results</text><text x="692" y="156" class="body" text-anchor="start">Baseline / model</text><text x="692" y="191" class="body" text-anchor="start">Held-out target</text>
<path class="flow" d="M284 163H350" marker-end="url(#oreflow-proposal-en-arrow)"/>
<path class="flow" d="M610 163H676" marker-end="url(#oreflow-proposal-en-arrow)"/>
<path class="flow" d="M806 248V306" marker-end="url(#oreflow-proposal-en-arrow)"/>
<rect class="panel" x="676" y="306" width="260" height="170" rx="12"/><text x="692" y="341" class="heading" text-anchor="start">State the limit</text><text x="692" y="384" class="body" text-anchor="start">Simulation scope</text><text x="692" y="419" class="body" text-anchor="start">Next validation</text>
<rect class="panel" x="24" y="306" width="586" height="170" rx="12"/><text x="40" y="341" class="heading" text-anchor="start">Inspect the consequences</text><text x="40" y="384" class="body" text-anchor="start">Recovery / grade / energy / water</text>
<path class="flow" d="M676 390H610" marker-end="url(#oreflow-proposal-en-arrow)"/>
<path class="flow recycle" d="M154 306V252" marker-end="url(#oreflow-proposal-en-arrow)"/>
<text x="480" y="513" class="body" text-anchor="middle">Use the result to define the next controlled test.</text>
</svg>
