<svg xmlns="http://www.w3.org/2000/svg" id="oreflow-pain-es" viewBox="0 0 960 520" role="img" aria-labelledby="oreflow-pain-es-title oreflow-pain-es-desc" lang="es">
<title id="oreflow-pain-es-title">Un cambio alcanza al circuito completo</title>
<desc id="oreflow-pain-es-desc">La alimentación, molienda, separación y calidad se conectan mediante flujos y recirculación.</desc>
<defs><style>#oreflow-pain-es text{font:26px var(--font-sans,system-ui);fill:var(--color-fg)}#oreflow-pain-es .title{font-size:30px;font-weight:650}#oreflow-pain-es .heading{font-size:27px;font-weight:650}#oreflow-pain-es .panel{fill:var(--color-surface);stroke:var(--color-border);stroke-width:2}#oreflow-pain-es .soft{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:2}#oreflow-pain-es .line{fill:none;stroke:var(--color-fg-subtle);stroke-width:3}#oreflow-pain-es .flow{fill:none;stroke:var(--color-accent);stroke-width:3;stroke-dasharray:9 7;animation:oreflow-pain-es-flow 2s linear 5}#oreflow-pain-es .recycle{stroke-dasharray:5 5}#oreflow-pain-es .accent{fill:var(--color-accent);stroke:none}@keyframes oreflow-pain-es-flow{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){#oreflow-pain-es .flow{animation:none}}</style><marker id="oreflow-pain-es-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="accent" d="M0 0 10 5 0 10Z"/></marker></defs>
<text x="24" y="40" class="title" text-anchor="start">Un cambio alcanza al circuito completo</text>
<rect class="panel" x="24" y="78" width="210" height="218" rx="12"/><text x="40" y="113" class="heading" text-anchor="start">Alimentación</text><text x="40" y="156" class="body" text-anchor="start">Tamaño y ley</text><text x="40" y="191" class="body" text-anchor="start">Dureza</text>
<rect class="panel" x="258" y="78" width="210" height="218" rx="12"/><text x="274" y="113" class="heading" text-anchor="start">Molienda</text><text x="274" y="156" class="body" text-anchor="start">Molino / ciclón</text><text x="274" y="191" class="body" text-anchor="start">Potencia</text><text x="274" y="226" class="body" text-anchor="start">P80 alcanzado</text>
<rect class="panel" x="492" y="78" width="210" height="218" rx="12"/><text x="508" y="113" class="heading" text-anchor="start">Separación</text><text x="508" y="156" class="body" text-anchor="start">Recuperación</text><text x="508" y="191" class="body" text-anchor="start">Ley del</text><text x="508" y="226" class="body" text-anchor="start">concentrado</text>
<rect class="panel" x="726" y="78" width="210" height="218" rx="12"/><text x="742" y="113" class="heading" text-anchor="start">Productos</text><text x="742" y="156" class="body" text-anchor="start">Metal</text><text x="742" y="191" class="body" text-anchor="start">recuperado</text><text x="742" y="226" class="body" text-anchor="start">Metal en</text><text x="742" y="261" class="body" text-anchor="start">relaves</text>
<path class="flow" d="M234 180H258" marker-end="url(#oreflow-pain-es-arrow)"/>
<path class="flow" d="M468 180H492" marker-end="url(#oreflow-pain-es-arrow)"/>
<path class="flow" d="M702 180H726" marker-end="url(#oreflow-pain-es-arrow)"/>
<path class="flow recycle" d="M450 296V335H276V299" marker-end="url(#oreflow-pain-es-arrow)"/>
<text x="480" y="380" class="body" text-anchor="middle">La recirculación cambia la carga del molino</text>
<rect class="soft" x="24" y="412" width="912" height="94" rx="12"/>
<text x="44" y="450" class="body" text-anchor="start">La molienda solicitada debe respetar la potencia instalada.</text>
<text x="44" y="486" class="body" text-anchor="start">Ley, recuperación, agua y tratamiento están conectados.</text>
</svg>
