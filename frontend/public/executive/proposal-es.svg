<svg xmlns="http://www.w3.org/2000/svg" id="oreflow-proposal-es" viewBox="0 0 960 520" role="img" aria-labelledby="oreflow-proposal-es-title oreflow-proposal-es-desc" lang="es">
<title id="oreflow-proposal-es-title">Una comparación controlada conserva el contexto</title>
<desc id="oreflow-proposal-es-desc">Se declara un cambio acotado, se resuelve el circuito, se compara evidencia y se explicitan límites.</desc>
<defs><style>#oreflow-proposal-es text{font:26px var(--font-sans,system-ui);fill:var(--color-fg)}#oreflow-proposal-es .title{font-size:30px;font-weight:650}#oreflow-proposal-es .heading{font-size:27px;font-weight:650}#oreflow-proposal-es .panel{fill:var(--color-surface);stroke:var(--color-border);stroke-width:2}#oreflow-proposal-es .soft{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:2}#oreflow-proposal-es .line{fill:none;stroke:var(--color-fg-subtle);stroke-width:3}#oreflow-proposal-es .flow{fill:none;stroke:var(--color-accent);stroke-width:3;stroke-dasharray:9 7;animation:oreflow-proposal-es-flow 2s linear 5}#oreflow-proposal-es .recycle{stroke-dasharray:5 5}#oreflow-proposal-es .accent{fill:var(--color-accent);stroke:none}@keyframes oreflow-proposal-es-flow{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){#oreflow-proposal-es .flow{animation:none}}</style><marker id="oreflow-proposal-es-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="accent" d="M0 0 10 5 0 10Z"/></marker></defs>
<text x="24" y="40" class="title" text-anchor="start">Una comparación controlada conserva el contexto</text>
<rect class="panel" x="24" y="78" width="260" height="170" rx="12"/><text x="40" y="113" class="heading" text-anchor="start">Definir cambio</text><text x="40" y="156" class="body" text-anchor="start">Caso / entrada</text><text x="40" y="191" class="body" text-anchor="start">Límites</text>
<rect class="panel" x="350" y="78" width="260" height="170" rx="12"/><text x="366" y="113" class="heading" text-anchor="start">Resolver circuito</text><text x="366" y="156" class="body" text-anchor="start">Masa / agua</text><text x="366" y="191" class="body" text-anchor="start">Límites del equipo</text>
<rect class="panel" x="676" y="78" width="260" height="170" rx="12"/><text x="692" y="113" class="heading" text-anchor="start">Contrastar datos</text><text x="692" y="156" class="body" text-anchor="start">Modelo / referencia</text><text x="692" y="191" class="body" text-anchor="start">Objetivo reservado</text>
<path class="flow" d="M284 163H350" marker-end="url(#oreflow-proposal-es-arrow)"/>
<path class="flow" d="M610 163H676" marker-end="url(#oreflow-proposal-es-arrow)"/>
<path class="flow" d="M806 248V306" marker-end="url(#oreflow-proposal-es-arrow)"/>
<rect class="panel" x="676" y="306" width="260" height="170" rx="12"/><text x="692" y="341" class="heading" text-anchor="start">Definir límites</text><text x="692" y="384" class="body" text-anchor="start">Alcance simulado</text><text x="692" y="419" class="body" text-anchor="start">Próxima validación</text>
<rect class="panel" x="24" y="306" width="586" height="170" rx="12"/><text x="40" y="341" class="heading" text-anchor="start">Inspeccionar las consecuencias</text><text x="40" y="384" class="body" text-anchor="start">Recuperación / ley / energía / agua</text>
<path class="flow" d="M676 390H610" marker-end="url(#oreflow-proposal-es-arrow)"/>
<path class="flow recycle" d="M154 306V252" marker-end="url(#oreflow-proposal-es-arrow)"/>
<text x="480" y="513" class="body" text-anchor="middle">El resultado permite definir la próxima prueba controlada.</text>
</svg>
