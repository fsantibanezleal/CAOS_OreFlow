<path class="flow" d="M188 180H206" marker-end="url(#oreflow-situation-es-arrow)"/>
<path class="flow recycle" d="M234 204V224H82V208" marker-end="url(#oreflow-situation-es-arrow)"/>
<path class="line" d="M382 148h24v28l12 38q0 10-12 10h-24q-12 0-12-10l12-38Z"/>
<path class="flow" d="M378 200h32"/>
