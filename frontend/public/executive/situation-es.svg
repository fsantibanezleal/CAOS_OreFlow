<svg xmlns="http://www.w3.org/2000/svg" id="oreflow-situation-es" viewBox="0 0 960 520" role="img" aria-labelledby="oreflow-situation-es-title oreflow-situation-es-desc" lang="es">
<title id="oreflow-situation-es-title">Cada evidencia responde una pregunta distinta</title>
<desc id="oreflow-situation-es-desc">Los estados simulados, muestras y horas de planta conservan sus propios objetivos y validaciones.</desc>
<defs><style>#oreflow-situation-es text{font:26px var(--font-sans,system-ui);fill:var(--color-fg)}#oreflow-situation-es .title{font-size:30px;font-weight:650}#oreflow-situation-es .heading{font-size:27px;font-weight:650}#oreflow-situation-es .panel{fill:var(--color-surface);stroke:var(--color-border);stroke-width:2}#oreflow-situation-es .soft{fill:var(--color-surface-2);stroke:var(--color-border);stroke-width:2}#oreflow-situation-es .line{fill:none;stroke:var(--color-fg-subtle);stroke-width:3}#oreflow-situation-es .flow{fill:none;stroke:var(--color-accent);stroke-width:3;stroke-dasharray:9 7;animation:oreflow-situation-es-flow 2s linear 5}#oreflow-situation-es .recycle{stroke-dasharray:5 5}#oreflow-situation-es .accent{fill:var(--color-accent);stroke:none}@keyframes oreflow-situation-es-flow{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){#oreflow-situation-es .flow{animation:none}}</style><marker id="oreflow-situation-es-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="accent" d="M0 0 10 5 0 10Z"/></marker></defs>
<text x="24" y="40" class="title" text-anchor="start">Cada evidencia responde una pregunta distinta</text>
<rect class="panel" x="24" y="78" width="288" height="300" rx="12"/><text x="40" y="113" class="heading" text-anchor="start">Estados simulados</text>
<text x="40" y="278" class="body" text-anchor="start">Entradas declaradas</text>
<text x="40" y="314" class="body" text-anchor="start">Objetivos simulados</text>
<text x="40" y="350" class="body" text-anchor="start">Reservar minerales</text>
<rect class="panel" x="336" y="78" width="288" height="300" rx="12"/><text x="352" y="113" class="heading" text-anchor="start">Muestras medidas</text>
<text x="352" y="278" class="body" text-anchor="start">Ensayos de muestras</text>
<text x="352" y="314" class="body" text-anchor="start">Respetar grupos</text>
<text x="352" y="350" class="body" text-anchor="start">Incertidumbre</text>
<rect class="panel" x="648" y="78" width="288" height="300" rx="12"/><text x="664" y="113" class="heading" text-anchor="start">Horas de planta</text>
<text x="664" y="278" class="body" text-anchor="start">Datos anteriores</text>
<text x="664" y="314" class="body" text-anchor="start">Hora siguiente</text>
<text x="664" y="350" class="body" text-anchor="start">Partición temporal</text>
<rect class="soft" x="54" y="156" width="58" height="48" rx="6"/>
<rect class="soft" x="130" y="156" width="58" height="48" rx="6"/>
<rect class="soft" x="206" y="156" width="58" height="48" rx="6"/>
