<path class="flow" d="M450 200h32"/>
<path class="line" d="M526 148h24v28l12 38q0 10-12 10h-24q-12 0-12-10l12-38Z"/>
<path class="flow" d="M522 200h32"/>
<rect class="soft" x="672" y="154" width="110" height="70" rx="6"/>
<rect class="soft" x="808" y="154" width="104" height="70" rx="6"/>
<path class="line" d="M795 142V236" stroke-dasharray="6 6"/>
<text x="727" y="198" class="body" text-anchor="middle">Antes</text>
<text x="860" y="198" class="body" text-anchor="middle">Luego</text>
<rect class="soft" x="24" y="412" width="912" height="94" rx="12"/>
<text x="44" y="450" class="body" text-anchor="start">Cada resultado conserva su objetivo, partición y fuente.</text>
<text x="44" y="486" class="body" text-anchor="start">Cerrar un balance simulado no calibra una planta.</text>
