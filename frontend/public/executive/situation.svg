<rect class="soft" x="808" y="154" width="104" height="70" rx="6"/>
<path class="line" d="M795 142V236" stroke-dasharray="6 6"/>
<text x="727" y="198" class="body" text-anchor="middle">Past</text>
<text x="860" y="198" class="body" text-anchor="middle">Next</text>
<rect class="soft" x="24" y="412" width="912" height="94" rx="12"/>
<text x="44" y="450" class="body" text-anchor="start">Keep the target, split and source with each result.</text>
<text x="44" y="486" class="body" text-anchor="start">A closed simulator balance is not plant calibration.</text>
</svg>
