<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" role="img" aria-labelledby="title description">
  <title id="title">Mineral-processing circuit and response shapes</title>
  <desc id="description">Five circuit states from feed to products. Small response shapes are schematic; numerical results appear in the workbench.</desc>
  <rect x="1" y="1" width="538" height="428" rx="8" fill="var(--color-surface)" stroke="var(--color-border)"/>
  <g fill="var(--color-fg)" font-family="var(--font-sans)" font-weight="700" font-size="17">
    <text class="l-en" x="19" y="30">Process chain</text>
    <text class="l-es" x="19" y="30">Cadena de proceso</text>
  </g>
  <path d="M19 42H521" stroke="var(--color-border)"/>
  <g fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="1.4">
    <rect x="44" y="54" width="477" height="60" rx="6"/>
    <rect x="44" y="124" width="477" height="60" rx="6"/>
    <rect x="44" y="194" width="477" height="60" rx="6"/>
    <rect x="44" y="264" width="477" height="60" rx="6"/>
    <rect x="44" y="334" width="477" height="60" rx="6"/>
  </g>
  <g fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round">
    <path d="M27 96V131M27 166V201M27 236V271M27 306V341"/>
  </g>
  <g fill="var(--color-accent)"><path d="m23 126 4 7 4-7m-8 70 4 7 4-7m-8 70 4 7 4-7m-8 70 4 7 4-7"/></g>
  <g fill="var(--color-accent)" font-family="var(--font-mono)" font-weight="700" font-size="13">
    <text x="58" y="75">01</text><text x="58" y="145">02</text><text x="58" y="215">03</text><text x="58" y="285">04</text><text x="58" y="355">05</text>
  </g>
  <g fill="var(--color-fg)" font-family="var(--font-sans)" font-weight="700" font-size="16">
    <g class="l-en"><text x="93" y="76">Feed</text><text x="93" y="146">Comminution</text><text x="93" y="216">Classification</text><text x="93" y="286">Rougher flotation</text><text x="93" y="356">Products</text></g>
    <g class="l-es"><text x="93" y="76">Alimentación</text><text x="93" y="146">Conminución</text><text x="93" y="216">Clasificación</text><text x="93" y="286">Flotación rougher</text><text x="93" y="356">Productos</text></g>
  </g>
  <g fill="var(--color-fg-subtle)" font-family="var(--font-sans)" font-size="13">
    <g class="l-en"><text x="93" y="98">mass · grade · size distribution</text><text x="93" y="168">crusher + mill · P80 · energy</text><text x="93" y="238">size-bin partition · overflow</text><text x="93" y="308">residence · reagent · recovery</text><text x="93" y="378">concentrate + combined tailings</text></g>
    <g class="l-es"><text x="93" y="98">masa · ley · distribución de tamaños</text><text x="93" y="168">chancado + molino · P80 · energía</text><text x="93" y="238">partición por tamaño · finos</text><text x="93" y="308">tiempo · reactivo · recuperación</text><text x="93" y="378">concentrado + relaves combinados</text></g>
  </g>
