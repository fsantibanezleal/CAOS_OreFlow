<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" class="arch-svg" role="img" aria-label="The science: from the size grid to the method records">
  <style>
    /* the page's tokens inside the app; CSS system colours where the file is shown as an image */
    .arch-svg { color-scheme: light dark; }
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, "Cascadia Mono", Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2, Canvas); stroke: var(--color-border, GrayText); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent, LinkText); stroke-width: 1.6; }
    .arch-svg .bx-good { stroke: var(--color-good, LinkText); stroke-width: 1.6; }
    .arch-svg .bx-warn { stroke: var(--color-warn, GrayText); stroke-width: 1.6; }
    .arch-svg .band { fill: none; stroke: var(--color-border, GrayText); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .arch-svg .bt { fill: var(--color-fg-subtle, GrayText); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
    .arch-svg .h1 { fill: var(--color-fg, CanvasText); font-size: 15px; font-weight: 700; }
    .arch-svg .sub { fill: var(--color-fg-subtle, GrayText); font-size: 10.5px; }
    .arch-svg .ttl { fill: var(--color-fg, CanvasText); font-size: 12.5px; font-weight: 600; }
    .arch-svg .it { fill: var(--color-fg, CanvasText); font-size: 10.5px; }
    .arch-svg .cd { fill: var(--color-accent, LinkText); font-size: 10px; }
    .arch-svg .eq { fill: var(--color-fg, CanvasText); font-size: 10.5px; }
    .arch-svg .mu { fill: var(--color-fg-subtle, GrayText); font-size: 10px; font-style: italic; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint, GrayText); stroke-width: 1.5; }
    .arch-svg .flow-hi { fill: none; stroke: var(--color-accent, LinkText); stroke-width: 1.5; }
    .arch-svg .flow-dash { fill: none; stroke: var(--color-warn, GrayText); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arch-svg .lbl { fill: var(--color-fg-subtle, GrayText); font-size: 9.5px; }
    .arch-svg .chip { fill: var(--color-surface, Canvas); stroke: var(--color-border, GrayText); stroke-width: 1; }
    /* Standalone default: English. Inside the modal the shell's [data-arch-lang] rules decide. */
    svg .l-es { display: none; }
  </style>
  <defs>
    <marker id="of-arch-4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint, GrayText)"/>
    </marker>
  </defs>
  <text class="h1 l-en" x="20" y="28">The science: a mass balance by size and mineral, solved in closed circuit</text>
  <text class="h1 l-es" x="20" y="28">La ciencia: un balance de masa por tamaño y mineral, resuelto en circuito cerrado</text>
  <text class="sub l-en" x="20" y="46">each box names the form the engine solves; the Methodology page gives every equation with its source and limits</text>
  <text class="sub l-es" x="20" y="46">cada caja nombra la forma que resuelve el motor; la página de Metodología da cada ecuación con su fuente y límites</text>
  <rect class="bx" x="20" y="70" width="196" height="76" rx="8"/>
  <text class="ttl l-en" x="32" y="89">Size grid and ore</text>
  <text class="ttl l-es" x="32" y="89">Malla y mineral</text>
  <text class="it l-neutral" x="32" y="105">xᵢ = 150000 · 2^(−i/4) µm</text>
  <text class="it l-en" x="32" y="119">63 classes, minerals, water</text>
  <text class="it l-es" x="32" y="119">63 clases, minerales, agua</text>
  <text class="cd mono l-neutral" x="32" y="133">engine/grid.py · ore.py</text>
  <rect class="bx" x="234" y="70" width="196" height="76" rx="8"/>
  <text class="ttl l-en" x="246" y="89">Crusher</text>
  <text class="ttl l-es" x="246" y="89">Chancador</text>
  <text class="it l-neutral" x="246" y="105">p = (I − C)(I − BC)⁻¹ f</text>
  <text class="it l-en" x="246" y="119">Whiten classification</text>
  <text class="it l-es" x="246" y="119">clasificación de Whiten</text>
  <text class="cd mono l-neutral" x="246" y="133">engine/comminution.py</text>
  <rect class="bx" x="448" y="70" width="196" height="76" rx="8"/>
  <text class="ttl l-en" x="460" y="89">Ball mill</text>
  <text class="ttl l-es" x="460" y="89">Molino de bolas</text>
  <text class="it l-neutral" x="460" y="105">T⁻¹ = I + eD + c₂e²D² + c₃e³D³</text>
  <text class="it l-en" x="460" y="119">three mixers, energy-specific</text>
  <text class="it l-es" x="460" y="119">tres mezcladores, por energía</text>
  <text class="cd mono l-neutral" x="460" y="133">engine/grinding.py</text>
  <rect class="bx" x="662" y="70" width="198" height="76" rx="8"/>
  <text class="ttl l-en" x="674" y="89">Hydrocyclones</text>
  <text class="ttl l-es" x="674" y="89">Hidrociclones</text>
  <text class="it l-neutral" x="674" y="105">y = Rf + (1−Rf)(1 − 2^−(d/d50c)^m)</text>
  <text class="it l-en" x="674" y="119">density-corrected cut, Plitt</text>
  <text class="it l-es" x="674" y="119">corte por densidad, Plitt</text>
  <text class="cd mono l-neutral" x="674" y="133">engine/cyclone.py</text>
  <path class="flow" d="M 216 108 L 232 108" marker-end="url(#of-arch-4)"/>
  <text class="lbl l-en" x="224.0" y="64" text-anchor="middle">feed f</text>
  <text class="lbl l-es" x="224.0" y="64" text-anchor="middle">alimentación f</text>
  <path class="flow" d="M 430 108 L 446 108" marker-end="url(#of-arch-4)"/>
  <text class="lbl l-en" x="438.0" y="64" text-anchor="middle">crushed</text>
  <text class="lbl l-es" x="438.0" y="64" text-anchor="middle">chancado</text>
  <path class="flow" d="M 644 108 L 660 108" marker-end="url(#of-arch-4)"/>
  <text class="lbl l-en" x="652.0" y="64" text-anchor="middle">discharge</text>
  <text class="lbl l-es" x="652.0" y="64" text-anchor="middle">descarga</text>
  <path class="flow" d="M 440 146 L 440 162" marker-end="url(#of-arch-4)"/>
  <text class="lbl l-en" x="448" y="158">every unit, in one closed loop</text>
  <text class="lbl l-es" x="448" y="158">cada unidad, en un circuito cerrado</text>
  <rect class="bx bx-hi" x="20" y="164" width="840" height="94" rx="8"/>
  <text class="ttl l-en" x="32" y="183">Closed circuit, solved</text>
  <text class="ttl l-es" x="32" y="183">Circuito cerrado, resuelto</text>
  <text class="it l-en" x="32" y="199">Illinois root finders on ln e and ln d50c give the target P80 and the design circulating load</text>
  <text class="it l-es" x="32" y="199">buscadores de Illinois sobre ln e y ln d50c dan el P80 objetivo y la carga circulante de diseño</text>
  <text class="it l-en" x="32" y="213">installed power caps e and the product coarsens; in the cut mode d50c is set, e draws the installed power, P80 and the load follow</text>
  <text class="it l-es" x="32" y="213">la potencia instalada limita e y el producto engruesa; en el modo de corte d50c se fija, e consume la potencia instalada, P80 y la carga resultan</text>
  <text class="it l-en" x="32" y="227">gold: a bleed b of the underflow passes the gravity unit, R(d) = R_max (1 − e^(−(d/x_g)²)) on the GRG; its tail returns to the mill</text>
  <text class="it l-es" x="32" y="227">oro: una purga b de la descarga pasa por la unidad gravimétrica, R(d) = R_max (1 − e^(−(d/x_g)²)) sobre el GRG; su relave vuelve al molino</text>
  <text class="cd mono l-neutral" x="32" y="241">engine/roots.py · grinding.py (the gravity bleed)</text>
  <path class="flow" d="M 440 258 L 440 268 L 222 268 L 222 280" marker-end="url(#of-arch-4)"/>
  <path class="flow" d="M 440 268 L 658 268 L 658 280" marker-end="url(#of-arch-4)"/>
  <text class="lbl l-en" x="448" y="278">overflow at the achieved P80</text>
  <text class="lbl l-es" x="448" y="278">rebose al P80 logrado</text>
  <rect class="bx bx-good" x="20" y="282" width="404" height="118" rx="8"/>
  <text class="ttl l-en" x="32" y="301">Flotation: rougher, regrind, cleaner, recleaner</text>
  <text class="ttl l-es" x="32" y="301">Flotación: rougher, remolienda, limpieza, relimpieza</text>
  <text class="it l-neutral" x="32" y="317">k = 60 P Sb fd(d) fD(D),  Sb = 6 Jg / D32</text>
  <text class="it l-neutral" x="32" y="331">r = (kτ + ENT·w) / (1 + kτ + ENT·w),  R_N = 1 − (1 − r)^N</text>
  <text class="it l-en" x="32" y="345">optional regrind, recleaner; cleaner tails to the rougher feed,</text>
  <text class="it l-es" x="32" y="345">remolienda y relimpieza opcionales; colas de limpieza al rougher,</text>
  <text class="it l-en" x="32" y="359">recleaner tails to the cleaner feed; to 1e-10 t/h, 1e-12 relative</text>
  <text class="it l-es" x="32" y="359">de relimpieza a la limpieza; a 1e-10 t/h y 1e-12 relativo</text>
  <text class="cd mono l-neutral" x="32" y="373">engine/flotation.py</text>
  <rect class="bx" x="440" y="282" width="420" height="76" rx="8"/>
  <text class="ttl l-en" x="452" y="301">LIMS (magnetite) and desliming (phosphate)</text>
  <text class="ttl l-es" x="452" y="301">LIMS (magnetita) y deslamado (fosfato)</text>
  <text class="it l-neutral" x="452" y="317">p = p_max (1 − e^(−d/d_f))</text>
  <text class="it l-en" x="452" y="331">drums capture by class; slimes leave before flotation</text>
  <text class="it l-es" x="452" y="331">los tambores capturan por clase; las lamas salen antes</text>
  <text class="cd mono l-neutral" x="452" y="345">engine/separation.py</text>
  <path class="flow" d="M 222 400 L 222 414" marker-end="url(#of-arch-4)"/>
  <path class="flow" d="M 650 358 L 650 414" marker-end="url(#of-arch-4)"/>
  <text class="lbl l-en" x="228" y="410">products</text>
  <text class="lbl l-es" x="228" y="410">productos</text>
  <text class="lbl l-en" x="656" y="390">products</text>
  <text class="lbl l-es" x="656" y="390">productos</text>
  <rect class="bx bx-warn" x="20" y="416" width="840" height="76" rx="8"/>
  <text class="ttl l-en" x="32" y="435">Audit and trace</text>
  <text class="ttl l-es" x="32" y="435">Auditoría y traza</text>
  <text class="it l-en" x="32" y="451">every unit rebalanced from its named streams: every mineral, element and the water within 1e-9</text>
  <text class="it l-es" x="32" y="451">cada unidad rebalanceada desde sus corrientes: cada mineral, elemento y el agua dentro de 1e-9</text>
  <text class="it l-en" x="32" y="465">grades from mineral masses and element contents from IUPAC atomic weights</text>
  <text class="it l-es" x="32" y="465">leyes desde masas de minerales y contenidos desde pesos atómicos IUPAC</text>
  <text class="cd mono l-neutral" x="32" y="479">engine/balance.py · chemistry.py · trace.py</text>
  <path class="flow" d="M 440 492 L 440 506" marker-end="url(#of-arch-4)"/>
  <text class="lbl l-en" x="448" y="503">the same engine, re-run by every record</text>
  <text class="lbl l-es" x="448" y="503">el mismo motor, reejecutado por cada registro</text>
  <rect class="bx" x="20" y="508" width="204" height="76" rx="8"/>
  <text class="ttl l-en" x="32" y="527">Kinetic fits</text>
  <text class="ttl l-es" x="32" y="527">Ajustes cinéticos</text>
  <text class="it l-neutral" x="32" y="543">ε = R̂_N − R_N</text>
  <text class="it l-en" x="32" y="557">5 lumped models, LM</text>
  <text class="it l-es" x="32" y="557">5 modelos agrupados, LM</text>
  <text class="cd mono l-neutral" x="32" y="571">engine/kinetics.py</text>
  <rect class="bx" x="234" y="508" width="204" height="76" rx="8"/>
  <text class="ttl l-en" x="246" y="527">Constrained optimum</text>
  <text class="ttl l-es" x="246" y="527">Óptimo con restricciones</text>
  <text class="it l-en" x="246" y="543">max w ṁ/ṁ₀ − (1−w) E/E₀, 3 limits</text>
  <text class="it l-es" x="246" y="543">max w ṁ/ṁ₀ − (1−w) E/E₀, 3 límites</text>
  <text class="it l-en" x="246" y="557">pattern search, 6 starts</text>
  <text class="it l-es" x="246" y="557">búsqueda por patrones, 6 inicios</text>
  <text class="cd mono l-neutral" x="246" y="571">methods/optimization.py</text>
  <rect class="bx" x="448" y="508" width="204" height="76" rx="8"/>
  <text class="ttl l-en" x="460" y="527">Uncertainty and Sobol</text>
  <text class="ttl l-es" x="460" y="527">Incertidumbre y Sobol</text>
  <text class="it l-neutral" x="460" y="543">S_i = V[E(Y|X_i)] / V(Y)</text>
  <text class="it l-en" x="460" y="557">128 SplitMix64 LHS draws, N = 256</text>
  <text class="it l-es" x="460" y="557">128 sorteos LHS SplitMix64, N = 256</text>
  <text class="cd mono l-neutral" x="460" y="571">methods/uncertainty.py</text>
  <rect class="bx bx-hi" x="662" y="508" width="198" height="76" rx="8"/>
  <text class="ttl l-en" x="674" y="527">Learned lane</text>
  <text class="ttl l-es" x="674" y="527">Vía aprendida</text>
  <text class="it l-en" x="674" y="543">R², RMSE on unseen plants</text>
  <text class="it l-es" x="674" y="543">R², RMSE en plantas no vistas</text>
  <text class="it l-en" x="674" y="557">5 models, guard, ONNX, screen</text>
  <text class="it l-es" x="674" y="557">5 modelos, guardia, ONNX, filtro</text>
  <text class="cd mono l-neutral" x="674" y="571">methods/learning.py</text>
  <text class="mu l-en" x="440" y="600" text-anchor="middle">the screen filters the target-mode searches only; the lumped models, the optimizer and the surrogate are comparisons fitted to this engine</text>
  <text class="mu l-es" x="440" y="600" text-anchor="middle">el filtro actúa solo en las búsquedas del modo objetivo; los modelos agrupados, el optimizador y el sustituto son comparaciones ajustadas a este motor</text>
</svg>
