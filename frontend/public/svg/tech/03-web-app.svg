  <text class="sub l-en" x="20" y="46">React and Vite on the shared CAOS shell; the workbench recomputes a state live, the pages read the committed records</text>
  <text class="sub l-es" x="20" y="46">React y Vite sobre el shell compartido de CAOS; el laboratorio recalcula un estado en vivo, las páginas leen los registros versionados</text>
