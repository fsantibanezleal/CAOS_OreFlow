<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 492" width="880" class="arch-svg" role="img" aria-label="The web app: build overlay, routes, the workbench loop and the pages">
  <style>
    /* the page's tokens inside the app; CSS system colours where the file is shown as an image */
    .arch-svg { color-scheme: light dark; }
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, "Cascadia Mono", Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2, Canvas); stroke: var(--color-border, GrayText); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent, LinkText); stroke-width: 1.6; }
    .arch-svg .bx-good { stroke: var(--color-good, LinkText); stroke-width: 1.6; }
    .arch-svg .bx-warn { stroke: var(--color-warn, GrayText); stroke-width: 1.6; }
