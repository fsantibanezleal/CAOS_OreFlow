  <text class="h1 l-en" x="20" y="28">OreFlow: how a grinding and separation circuit trades recovery, grade, energy and water</text>
  <text class="h1 l-es" x="20" y="28">OreFlow: cómo un circuito de molienda y separación intercambia recuperación, ley, energía y agua</text>
  <text class="sub l-en" x="20" y="46">a steady-state mass balance by size class and mineral, solved in closed circuit, for twelve authored ores and plants</text>
  <text class="sub l-es" x="20" y="46">un balance de masa estacionario por clase de tamaño y mineral, resuelto en circuito cerrado, para doce minerales y plantas de autor</text>
