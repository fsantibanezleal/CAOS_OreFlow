name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
jobs:
  scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-precompute.txt -r requirements-dev.txt
      - run: ruff check data-pipeline tests
      - run: pytest
      - run: python data-pipeline/run.py all --output "${{ runner.temp }}/oreflow-smoke"
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/check_template_residue.py
      - run: python scripts/check_content_standards.py
      - run: python scripts/check_artifacts.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run typecheck && npm run test && npm run build
