<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" class="fig-svg" viewBox="0 0 420 250" role="img" aria-label="Liberation curve by size and the three particle classes"><style>
.fig-svg { color-scheme: light dark; }
.dg-axis { stroke: var(--color-fg-faint, GrayText); stroke-width: 1.3; }
