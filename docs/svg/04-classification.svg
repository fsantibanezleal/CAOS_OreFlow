<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" class="fig-svg" viewBox="0 0 420 240" role="img" aria-label="Cyclone partition for the gangue and for a dense mineral"><style>
.fig-svg { color-scheme: light dark; }
.dg-axis { stroke: var(--color-fg-faint, GrayText); stroke-width: 1.3; }
.dg-axis-label { fill: var(--color-fg-subtle, GrayText); font: 12px var(--font-sans, system-ui, sans-serif); }
.dg-tick { fill: var(--color-fg-faint, GrayText); font: 11px var(--font-mono, ui-monospace, monospace); }
.dg-grid { stroke: var(--color-border, GrayText); stroke-width: 0.5; opacity: 0.6; }
.dg-curve { fill: none; stroke: var(--color-accent, LinkText); stroke-width: 2.2; stroke-linejoin: round; }
.dg-curve-2 { fill: none; stroke: var(--color-magenta, VisitedText); stroke-width: 2; }
.dg-curve-faint { fill: none; stroke: var(--color-fg-faint, GrayText); stroke-width: 1.4; stroke-dasharray: 4 3; }
.dg-asymptote { stroke: var(--color-bad, VisitedText); stroke-width: 1.4; stroke-dasharray: 4 4; }
.dg-marker { stroke: var(--color-warn, GrayText); stroke-width: 1.2; stroke-dasharray: 3 3; }
.dg-marker-label { fill: var(--color-warn, GrayText); font: 600 11px var(--font-mono, ui-monospace, monospace); }
.dg-note { fill: var(--color-fg-faint, GrayText); font: italic 11px var(--font-sans, system-ui, sans-serif); }
.dg-fill-accent { fill: color-mix(in oklab, var(--color-accent, LinkText) 16%, transparent); stroke: var(--color-accent, LinkText); stroke-width: 1; }
.dg-fill-warn { fill: color-mix(in oklab, var(--color-warn, GrayText) 16%, transparent); stroke: var(--color-warn, GrayText); stroke-width: 1; }
.dg-box { fill: var(--color-surface, Canvas); stroke: var(--color-border, GrayText); stroke-width: 1.3; }
.dg-box.accent { stroke: var(--color-accent, LinkText); fill: var(--color-accent-soft, Canvas); }
.dg-box.good { stroke: var(--color-good, LinkText); }
.dg-box-title { fill: var(--color-fg, CanvasText); font: 650 12px var(--font-sans, system-ui, sans-serif); }
.dg-box-title.accent { fill: var(--color-accent, LinkText); }
.dg-box-sub { fill: var(--color-fg-subtle, GrayText); font: 10.5px var(--font-mono, ui-monospace, monospace); }
.dg-node { fill: var(--color-surface, Canvas); stroke: var(--color-accent, LinkText); stroke-width: 1.4; }
.dg-node-label { fill: var(--color-fg, CanvasText); font: 600 12px var(--font-mono, ui-monospace, monospace); }
.dg-edge { stroke: var(--color-fg-faint, GrayText); stroke-width: 1.4; fill: none; }
.dg-edge-label { fill: var(--color-fg-subtle, GrayText); font: 11px var(--font-mono, ui-monospace, monospace); }
.dg-arrowhead { fill: var(--color-fg-faint, GrayText); }
.dg-bar { fill: var(--color-accent, LinkText); }
.dg-bar-2 { fill: var(--color-magenta, VisitedText); }
.dg-bar-label { fill: var(--color-fg-subtle, GrayText); font: 11px var(--font-sans, system-ui, sans-serif); }
.of-dg-frame { fill: none; stroke: var(--color-border, GrayText); stroke-width: 1.2; stroke-dasharray: 5 4; }
.dg-box.of-dg-optional { stroke-dasharray: 5 3; }
.of-dg-optional-edge { stroke: var(--color-fg-faint, GrayText); stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
.of-dg-small { fill: var(--color-fg, CanvasText); font: 9.5px var(--font-sans, system-ui, sans-serif); }
.fig-svg .dg-note, .fig-svg .dg-tick { fill: var(--color-fg-subtle, GrayText); }
</style><line class="dg-axis" x1="50" y1="190" x2="390" y2="190"></line><line class="dg-axis" x1="50" y1="190" x2="50" y2="20"></line><line class="dg-asymptote" x1="50" y1="160" x2="390" y2="160"></line><text class="dg-marker-label" x="330" y="155">R<tspan dy="0.3em" font-size="72%">f</tspan><tspan dy="-0.3em">​</tspan></text><path class="dg-curve" d="M 55 160 C 170 160, 220 150, 250 105 S 300 32, 385 30"></path><path class="dg-curve-2" d="M 55 160 C 120 160, 160 150, 185 105 S 235 32, 385 30"></path><line class="dg-marker" x1="250" y1="190" x2="250" y2="95"></line><line class="dg-marker" x1="185" y1="190" x2="185" y2="95"></line><text class="dg-marker-label" x="254" y="206">d50c</text><text class="dg-marker-label" x="150" y="206">d50c,k</text><text class="dg-edge-label" x="300" y="70">gangue</text><text class="dg-edge-label" x="180" y="78" text-anchor="end">dense mineral</text><text class="dg-axis-label" x="220" y="228" text-anchor="middle">size (log scale)</text><text class="dg-axis-label" x="18" y="105" text-anchor="middle" transform="rotate(-90 18 105)">fraction to underflow</text></svg>
